name: Release

# After the release gates are complete:
# 1. Update package.json version and add a matching CHANGELOG.md section,
#    headed "## X.Y.Z - YYYY-MM-DD". Keep pending changes under Unreleased.
# 2. Merge those changes, then push the matching vX.Y.Z tag.
# CI runs against the tagged commit before GitHub publishes its release notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate version and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_notes.py "$RELEASE_TAG"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release_notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
