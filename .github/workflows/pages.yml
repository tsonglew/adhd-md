name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/install.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，后来的取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 站点自审（吃自己的狗粮）
        run: python3 skill/scripts/adhd_md.py selftest

      # 让 curl -fsSL https://tsonglew.github.io/adhd-md/install.sh | bash 能用。
      # 复制而不是维护第二份，两边不会漂移。
      - name: 安装脚本复制进站点
        run: cp scripts/install.sh site/install.sh

      - uses: actions/configure-pages@v5
        with:
          # 仓库还没开 Pages 时自动开，省掉 fork 后第一次必然失败的那一跑
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
