<!DOCTYPE html>
<!-- Text comes from src/i18n/ui.ts. scripts/build-og.sh fills this template in a temporary directory. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body { position: relative; overflow: hidden; background: #f6f8fb; color: #172332; font-family: "Manrope", "Noto Sans SC", "PingFang SC", sans-serif; }
  .layout { height: 100%; padding: 52px 64px 36px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 15px; }
  .brand { width: 46px; height: 46px; flex: 0 0 auto; }
  .eyebrow { font: 600 20px/1.4 "Manrope", "Noto Sans SC", sans-serif; letter-spacing: -.02em; }
  .content { position: relative; flex: 1; padding-top: 43px; }
  h1 { max-width: 800px; font-size: 83px; font-weight: 700; line-height: 1.24; letter-spacing: -.06em; }
  h1 span { display: block; color: #365cf5; }
  .subtitle { max-width: 720px; margin-top: 25px; color: #596578; font-size: 24px; font-weight: 500; line-height: 1.65; letter-spacing: -.02em; }
  .tags { display: flex; align-items: center; gap: 10px; margin-top: 27px; }
  .tags span { padding: 9px 15px; border: 1px solid #dce2ed; border-radius: 11px; background: #fff; color: #344359; font-size: 17px; font-weight: 600; line-height: 1.4; }
  .tags span:last-child { color: #365cf5; background: #eaf0ff; border-color: #d7e0ff; font-family: "IBM Plex Mono", monospace; font-size: 16px; }
  .illustration { position: absolute; width: 278px; height: 318px; right: 0; top: 58px; }
  .page { position: absolute; inset: 20px 0 0 20px; border: 1px solid #dce2ed; border-radius: 23px; background: #fff; box-shadow: 0 20px 44px -30px #64718b55; }
  .page-back { inset: 0 20px 20px 0; background: #edf1f8; box-shadow: none; }
  .page-top { display: flex; align-items: center; gap: 5px; height: 47px; padding-left: 22px; border-bottom: 1px solid #edf0f5; }
  .page-top i { width: 5px; height: 5px; border-radius: 50%; background: #d1d8e5; }
  .text-lines { padding: 25px 22px; }
  .text-lines i { display: block; height: 7px; width: 100%; margin-bottom: 12px; border-radius: 4px; background: #e3e8f1; }
  .text-lines .title { width: 52%; height: 10px; background: #172332; margin-bottom: 22px; }
  .text-lines .short { width: 72%; }
  .active-lines { margin: 18px -9px 20px; padding: 16px 9px 5px; background: #edf1ff; border-left: 2px solid #365cf5; border-radius: 0 9px 9px 0; }
  .active-lines i { background: #9caeff; }
  .progress { position: absolute; bottom: 20px; left: 22px; right: 22px; height: 4px; background: #e9edf5; border-radius: 3px; }
  .progress::before { content: ""; display: block; width: 46%; height: 100%; background: #365cf5; border-radius: 3px; }
  .bookmark { position: absolute; top: 5px; right: 21px; width: 40px; height: 69px; filter: drop-shadow(0 5px 8px #365cf526); }
  .footer { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding-top: 23px; border-top: 1px solid #dce2ed; color: #677487; font-size: 17px; font-weight: 500; }
  .footer-mark { display: flex; gap: 6px; align-items: center; }
  .footer-mark i { display: block; width: 6px; height: 6px; border-radius: 50%; background: #cbd5e6; }
  .footer-mark i:first-child { width: 25px; border-radius: 4px; background: #365cf5; }
  html[lang="en"] h1 { font-size: 68px; line-height: 1.2; letter-spacing: -.058em; }
  html[lang="en"] .content { padding-top: 51px; }
  html[lang="en"] .subtitle { max-width: 675px; font-size: 23px; }
  html[lang="en"] .illustration { top: 61px; }
</style>
</head>
<body>
  <main class="layout">
    <div class="top">
      <svg class="brand" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#365cf5"/><g fill="#fff"><rect x="7" y="8" width="11" height="2.6" rx="1.3"/><rect x="7" y="14.7" width="9" height="2.6" rx="1.3"/><rect x="7" y="21.4" width="18" height="2.6" rx="1.3"/><path d="M21 6.5h5v11l-2.5-2-2.5 2z"/></g></svg>
      <p class="eyebrow">{{eyebrow}}</p>
    </div>
    <div class="content">
      <h1>{{titleLine1}}<span>{{titleLine2}}</span></h1>
      <p class="subtitle">{{subtitle}}</p>
      <div class="tags"><span>{{tag1}}</span><span>{{tag2}}</span><span>{{tag3}}</span></div>
      <div class="illustration" aria-hidden="true">
        <div class="page page-back"></div>
        <div class="page">
          <div class="page-top"><i></i><i></i><i></i></div>
          <div class="text-lines"><i class="title"></i><i></i><i class="short"></i><div class="active-lines"><i></i><i class="short"></i></div><i></i><i class="short"></i></div>
          <div class="progress"></div>
        </div>
        <svg class="bookmark" viewBox="0 0 40 69"><path d="M0 0h40v69L20 55 0 69z" fill="#365cf5"/><path d="m13 25 5 5 10-11" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="footer"><p>{{footer}}</p><div class="footer-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
  </main>
</body>
</html>
